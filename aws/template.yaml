# GENERATED by tools/build-template.mjs from aws/template.src.yaml and
# aws/lambda.cjs. Do not edit by hand: edit those and re-run the script.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ProPulse 2026 check-in store. Receives badge IDs, device IDs and timestamps
  ONLY - no names, companies, e-mails or phone numbers. Generated from
  aws/template.src.yaml + aws/lambda.cjs by tools/build-template.mjs.

Parameters:
  EventKey:
    Type: String
    NoEcho: true
    MinLength: 24
    AllowedPattern: '[A-Za-z0-9]+'
    Description: >-
      Shared key the phones send in the x-event-key header. Letters and digits
      only, at least 24 characters. Keeps random internet traffic out; it is
      not a password against someone holding an event phone.
  AllowedOrigin:
    Type: String
    Default: https://krausstt.github.io
    Description: The only website allowed to call the API (CORS). No trailing slash.

Resources:
  # One item per scan, keyed by the phone-generated idempotency key.
  # Retained and deletion-protected: deleting the stack must never delete
  # the attendance record. Point-in-time recovery covers operator mistakes.
  CheckinTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: propulse-checkins
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true

  # The function may write items and nothing else: no read, no delete, no scan.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: put-checkins-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt CheckinTable.Arn

  CheckinFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: propulse-checkins
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref CheckinTable
          EVENT_KEY: !Ref EventKey
      Code:
        ZipFile: |
          'use strict';
          const { timingSafeEqual } = require('crypto');
          const FIELDS = ['device_id', 'idempotency_key', 'propulse_id', 'scanned_at'];
          const RX = {
            idempotency_key: /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/,
            propulse_id: /^\d{1,7}$/,
            device_id: /^dev-[0-9a-f]{8}$/,
            scanned_at: /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(\.\d{1,3})?Z$/,
          };
          const reply = (statusCode, body) => ({ statusCode, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
          function problem(c) {
            if (!c || typeof c !== 'object' || Array.isArray(c)) return 'not an object';
            if (Object.keys(c).sort().join() !== FIELDS.join()) return `must have exactly ${FIELDS.join(',')}`;
            for (const f of FIELDS) if (typeof c[f] !== 'string' || !RX[f].test(c[f])) return `${f} invalid`;
            if (Number.isNaN(Date.parse(c.scanned_at))) return 'scanned_at invalid';
            return null;
          }
          function keyOk(given, expected) {
            if (typeof given !== 'string' || !expected) return false;
            const a = Buffer.from(given), b = Buffer.from(expected);
            return a.length === b.length && timingSafeEqual(a, b);
          }
          function makeHandler(db, { table, key, now = () => new Date().toISOString() }) {
            return async event => {
              const headers = event.headers || {};
              if (!keyOk(headers['x-event-key'], key)) return reply(401, { error: 'bad event key' });
              let body;
              try {
                const raw = event.isBase64Encoded ? Buffer.from(event.body || '', 'base64').toString() : event.body || '';
                if (raw.length > 20000) return reply(413, { error: 'too large' });
                body = JSON.parse(raw);
              } catch { return reply(400, { error: 'not JSON' }); }
              if (!body || typeof body !== 'object' || Object.keys(body).join() !== 'checkins') return reply(400, { error: 'body must be {checkins:[...]}' });
              const list = body.checkins;
              if (!Array.isArray(list) || list.length < 1 || list.length > 25) return reply(400, { error: 'checkins: 1..25 items' });
              for (let i = 0; i < list.length; i++) {
                const p = problem(list[i]);
                if (p) return reply(400, { error: `checkin ${i}: ${p}` });
              }
              const accepted = [];
              let failed = 0;
              const at = now();
              await Promise.all(list.map(async c => {
                try {
                  await db.put({
                    TableName: table,
                    Item: {
                      idempotency_key: { S: c.idempotency_key },
                      propulse_id: { S: c.propulse_id },
                      scanned_at: { S: c.scanned_at },
                      device_id: { S: c.device_id },
                      received_at: { S: at },
                    },
                    ConditionExpression: 'attribute_not_exists(idempotency_key)',
                  });
                  accepted.push(c.idempotency_key);
                } catch (e) {
                  if (e && e.name === 'ConditionalCheckFailedException') accepted.push(c.idempotency_key);
                  else failed++;
                }
              }));
              console.log(JSON.stringify({ received: list.length, accepted: accepted.length, failed }));
              return reply(200, { accepted, failed });
            };
          }
          let cached;
          exports.handler = event => {
            if (!cached) {
              const { DynamoDBClient, PutItemCommand } = require('@aws-sdk/client-dynamodb');
              const client = new DynamoDBClient({});
              cached = makeHandler({ put: input => client.send(new PutItemCommand(input)) }, { table: process.env.TABLE, key: process.env.EVENT_KEY });
            }
            return cached(event);
          };
          exports.makeHandler = makeHandler;

  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/propulse-checkins
      RetentionInDays: 30

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: propulse-checkins
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST]
        AllowHeaders: [content-type, x-event-key]
        MaxAge: 3600

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CheckinFunction.Arn
      PayloadFormatVersion: '2.0'

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /checkins
      Target: !Sub integrations/${ApiIntegration}

  # Throttled: 10 requests/s steady, 20 burst. Five phones need a fraction of
  # that; anything above it is not the booth, and it caps the bill.
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CheckinFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/checkins

Outputs:
  ApiUrl:
    Description: Paste this into the phone setup link as ?api=
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table holding the check-ins
    Value: !Ref CheckinTable
